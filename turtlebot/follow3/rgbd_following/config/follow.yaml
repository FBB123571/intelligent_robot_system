# Example signature ONLY: replace with measured TonyPi body/approved marker colors.
# Hardware execution requires all three calibration flags and a finish polygon.
hardware_calibrated: false
identity_calibrated: false
depth_coverage_calibrated: false
sync_slop: 0.05
target_timeout: 0.5
mission_timeout: 1.0
tf_timeout: 0.5
grid_timeout: 1.0
perception:
  hsv_bands:
    - lower: [35, 90, 60]
      upper: [85, 255, 255]
  min_area_ratio: 0.001
  max_area_ratio: 0.35
  min_depth: 0.4
  max_depth: 4.0
  min_depth_samples: 30
  min_valid_ratio: 0.6
  max_depth_spread: 0.2
  depth_cluster_band: 0.12
  min_width_m: 0.025
  max_width_m: 0.5
  cloud_stride: 4
  min_cloud_points: 100
  min_cloud_ratio: 0.2
tracker:
  confirmations: 4
  timeout: 0.5
  speed: 0.5
  jitter: 0.12
  reacquire_radius: 0.45
  ambiguity_margin: 0.10
follow_distance: 1.0
minimum_distance: 0.65
footprint_radius: 0.26
max_linear: 0.12
max_angular: 0.4
braking_acceleration: 0.3
reaction_time: 0.3
finish_tolerance: 0.15
finish_hold: 2.0
finish_motion_tolerance: 0.08
# Convex polygon in this robot's odom frame, e.g. [[4,-1],[6,-1],[6,1],[4,1]].
# Measure after placing the robot at its starting position; odom must not reset.
finish_polygon: []
lost_failure_seconds: 60.0
