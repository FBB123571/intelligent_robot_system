name: offline checks
on: [push, pull_request]
jobs:
  ros-kinetic-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build actual Kinetic package with archived distribution dependencies
        run: docker build -f tools/ros-kinetic.Dockerfile -t rgbd-kinetic-check turtlebot/follow1/ar_marker_following
      - name: Exercise actual ROS transport, navigation, shadow output and loss stop
        run: docker run --rm -v "$PWD/.ros-test-results:/ws/build/test_results" rgbd-kinetic-check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kinetic-test-results
          path: .ros-test-results
          include-hidden-files: true
  python3:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install PyYAML opencv-python-headless numpy
      - run: python tools/validate_project.py
      - run: python -m unittest discover -s tests -v
      - run: python humanoid/scripts/competition.py --simulate
  kinetic-python2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test shared decisions with Kinetic Python version
        run: >-
          docker run --rm -v "$PWD:/work" -w /work python:2.7.18-buster
          python -m unittest discover -s tests -p test_core.py -v
      - name: Check ROS adapter Python 2 syntax
        run: >-
          docker run --rm -v "$PWD:/work" -w /work python:2.7.18-buster
          python -m compileall -q turtlebot/follow1/ar_marker_following/scripts
      - name: Test method 3 depth decisions with Kinetic Python version
        run: >-
          docker run --rm -v "$PWD:/work" -w /work python:2.7.18-buster
          python -m unittest discover -s tests -p test_rgbd.py -v
      - name: Test method 3 tracking and geometry with Kinetic Python version
        run: >-
          docker run --rm -v "$PWD:/work" -w /work python:2.7.18-buster
          python -m unittest discover -s tests -p test_rgbd_control.py -v
      - name: Test method 3 recovery, visibility and inertia with Python 2
        run: >-
          docker run --rm -v "$PWD:/work" -w /work python:2.7.18-buster
          python -m unittest discover -s tests -p test_rgbd_optimizations.py -v
