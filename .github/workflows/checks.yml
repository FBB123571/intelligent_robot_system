name: offline checks
on: [push, pull_request]
jobs:
  python3:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install PyYAML opencv-python-headless numpy
      - run: python tools/validate_project.py
      - run: python -m unittest discover -s tests -v
      - run: python humanoid/scripts/competition.py --simulate
  kinetic-python2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test shared decisions with Kinetic Python version
        run: >-
          docker run --rm -v "$PWD:/work" -w /work python:2.7.18-buster
          python -m unittest discover -s tests -p test_core.py -v
      - name: Check ROS adapter Python 2 syntax
        run: >-
          docker run --rm -v "$PWD:/work" -w /work python:2.7.18-buster
          python -m compileall -q turtlebot/follow2/multi_robot_following/scripts turtlebot/follow3/rgbd_following
      - name: Test method 3 depth decisions with Kinetic Python version
        run: >-
          docker run --rm -v "$PWD:/work" -w /work python:2.7.18-buster
          python -m unittest discover -s tests -p test_rgbd.py -v
      - name: Test method 3 tracking and geometry with Kinetic Python version
        run: >-
          docker run --rm -v "$PWD:/work" -w /work python:2.7.18-buster
          python -m unittest discover -s tests -p test_rgbd_control.py -v
